<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Roleta Amigo Chocolate 🍫</title>

<style>
    body {
        background: #3b241a;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }

    h1 { font-size: 42px; text-shadow: 3px 3px 5px #000; }

    #roleta {
        margin: 40px auto;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        border: 12px solid #d2a679;
        background: conic-gradient(#6b3e26 0deg, #3b241a 360deg);
        display: flex; justify-content: center; align-items: center;
        font-size: 100px; overflow: hidden; position: relative;
    }

    #ponteiro {
        width: 0; height: 0; border-left: 15px solid transparent;
        border-right: 15px solid transparent; border-bottom: 25px solid #ffce89;
        margin-bottom: -20px;
    }

    button {
        background: #5a2e14; border: none; padding: 12px 26px;
        font-size: 20px; color: #fff; border-radius: 10px;
        cursor: pointer; margin: 6px; transition:.3s;
    }
    button:hover { transform: scale(1.08); background:#7a3c18; }

    #resultado {
        margin-top: 25px; font-size: 30px; background:#d2a679; color:#3b241a;
        padding:10px 20px; border-radius:10px; font-weight:bold; display:inline-block;
    }

    #lista{
        margin-top:15px;font-size:20px;background:#ffffff25;width:300px;
        padding:12px;border-radius:10px;margin:auto;
    }
</style>
</head>
<body>

<h1>🍫 Roleta — Amigo Chocolate 🍫</h1>

<div id="ponteiro"></div>
<div id="roleta">🍫</div>

<br>
<button id="btn-sortear">🎡 Girar</button>
<button id="btn-desfazer">↩ Desfazer Último Sorteio</button>

<p id="resultado"></p>

<h2>Já sorteados:</h2>
<div id="lista"><i>Carregando...</i></div>

<script type="module" src="script.js"></script>
</body>
</html>
