<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta — Amigo Chocolate 🎁🍫</title>

    <style>
        body {
            background: #3b1e12;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 32px;
            margin-top: 50px;
            font-weight: bold;
        }

        .roda {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 10px solid #d8a675;
            margin: 40px auto;
            background: conic-gradient(#6a4028, #8a5236, #6d3920);
        }

        button {
            padding: 13px 28px;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 8px;
        }

        #btnSortear {
            background: #80511d;
            color: white;
            font-weight: bold;
        }

        #btnDesfazer {
            color: white;
            background: #56371b;
            border: 2px solid #cc975d;
        }

        #resultado {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }

        #lista-sorteados {
            margin-top: 30px;
            background: #4f2b1d;
            padding: 15px;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
        }

        #lista-sorteados p {
            font-size: 18px;
            background: rgba(255,255,255,0.15);
            padding: 6px;
            margin: 5px 0;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>🍫 Roleta — Amigo Chocolate 🍫</h1>

    <div class="roda"></div>

    <button id="btnSortear" onclick="sortear()">🎲 Girar</button>
    <button id="btnDesfazer" onclick="desfazer()">↩ Desfazer Último</button>

    <p id="resultado"></p>

    <h2>Já sorteados:</h2>
    <div id="lista-sorteados">
        <p>Ninguém ainda 😅</p>
    </div>

    <!-- Conexão com o script -->
    <script type="module" src="script.js"></script>

</body>
</html>
